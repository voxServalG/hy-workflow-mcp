name: Publish npm package

on:
  release:
    types: [published]

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"
          package-manager-cache: false
      - name: Use an OIDC-capable npm CLI
        run: npm install --global npm@latest
      - run: npm ci
      - run: npm run verify
      - name: Validate release tag
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: >-
          node --input-type=module -e 'import fs from "node:fs";
          const pkg = JSON.parse(fs.readFileSync("package.json", "utf8"));
          if (process.env.RELEASE_TAG !== "v" + pkg.version)
          throw new Error("release tag must equal v" + pkg.version);'
      - name: Preview npm tarball
        run: npm pack --dry-run --json
      - name: Publish directly to npm
        env:
          IS_PRERELEASE: ${{ github.event.release.prerelease }}
        run: |
          if [ "$IS_PRERELEASE" = "true" ]; then
            npm publish --access public --tag next
          else
            npm publish --access public --tag latest
          fi
