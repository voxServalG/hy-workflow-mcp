name: Publish npm package

on:
  release:
    types: [published]

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"
          package-manager-cache: false
      - name: Validate release provenance
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          IS_PRERELEASE: ${{ github.event.release.prerelease }}
        run: |
          node --input-type=module <<'NODE'
          import fs from "node:fs";
          const pkg = JSON.parse(fs.readFileSync("package.json", "utf8"));
          const semver = /^(0|[1-9]\d*)\.(0|[1-9]\d*)\.(0|[1-9]\d*)(?:-([0-9A-Za-z-]+(?:\.[0-9A-Za-z-]+)*))?(?:\+[0-9A-Za-z-]+(?:\.[0-9A-Za-z-]+)*)?$/;
          const match = typeof pkg.version === "string" ? semver.exec(pkg.version) : null;
          if (!match) throw new Error("package.json version must be valid semver");
          if (process.env.RELEASE_TAG !== "v" + pkg.version) throw new Error("release tag must equal v" + pkg.version);
          const packageIsPrerelease = match[4] !== undefined;
          const releaseIsPrerelease = process.env.IS_PRERELEASE === "true";
          if (packageIsPrerelease !== releaseIsPrerelease) {
            throw new Error("package semver prerelease state must match GitHub release.prerelease");
          }
          NODE
          tag_commit="$(git rev-parse --verify "${RELEASE_TAG}^{commit}")"
          head_commit="$(git rev-parse --verify HEAD^{commit})"
          test "$tag_commit" = "$head_commit"
          git rev-parse --verify refs/remotes/origin/main^{commit}
          git merge-base --is-ancestor "$tag_commit" refs/remotes/origin/main
      - name: Use an OIDC-capable npm CLI
        run: npm install --global npm@11.13.0
      - run: npm ci
      - run: npm run verify
      - name: Build one release tarball
        run: |
          release_dir="$RUNNER_TEMP/hy-workflow-release"
          pack_report="$RUNNER_TEMP/hy-workflow-pack.json"
          mkdir -p "$release_dir"
          npm pack --json --pack-destination "$release_dir" > "$pack_report"
          RELEASE_DIR="$release_dir" PACK_REPORT="$pack_report" node --input-type=module <<'NODE'
          import { createHash } from "node:crypto";
          import fs from "node:fs";
          import path from "node:path";
          const report = JSON.parse(fs.readFileSync(process.env.PACK_REPORT, "utf8"));
          if (!Array.isArray(report) || report.length !== 1 || typeof report[0]?.filename !== "string") {
            throw new Error("npm pack must produce exactly one release tarball");
          }
          const releaseDir = fs.realpathSync(process.env.RELEASE_DIR);
          const archive = fs.realpathSync(path.join(releaseDir, report[0].filename));
          const relative = path.relative(releaseDir, archive);
          if (!relative || relative.startsWith("..") || path.isAbsolute(relative) || !archive.endsWith(".tgz")) {
            throw new Error("npm pack returned an invalid release tarball path");
          }
          const sha512 = createHash("sha512").update(fs.readFileSync(archive)).digest("hex");
          fs.appendFileSync(process.env.GITHUB_ENV, `HY_RELEASE_TGZ=${archive}\nHY_RELEASE_TGZ_SHA512=${sha512}\n`);
          NODE
      - name: Run thin installed-package acceptance
        run: npm run test:acceptance:thin -- --package-archive "$HY_RELEASE_TGZ"
      - name: Run public v0.5.0 upgrade oracle
        run: npm run test:acceptance:migration -- --legacy @voxstudio/hy-workflow@0.5.0 --candidate "$HY_RELEASE_TGZ"
      - name: Publish the accepted tarball directly to npm
        env:
          IS_PRERELEASE: ${{ github.event.release.prerelease }}
        run: |
          actual_sha512="$(node --input-type=module -e 'import { createHash } from "node:crypto"; import fs from "node:fs"; process.stdout.write(createHash("sha512").update(fs.readFileSync(process.argv[1])).digest("hex"))' "$HY_RELEASE_TGZ")"
          test "$actual_sha512" = "$HY_RELEASE_TGZ_SHA512"
          if [ "$IS_PRERELEASE" = "true" ]; then
            npm publish "$HY_RELEASE_TGZ" --access public --tag next
          else
            npm publish "$HY_RELEASE_TGZ" --access public --tag latest
          fi
