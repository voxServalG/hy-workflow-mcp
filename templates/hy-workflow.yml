name: hy-workflow

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  HY_WORKFLOW_RUNTIME_CONFIG_SOURCE: hy-workflow.runtime-config-source.v1

jobs:
  verify:
    name: Verify
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out the reviewed commit
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Run the pinned hy-workflow policy
        shell: bash
        run: npx --yes --package=__HY_WORKFLOW_PACKAGE_SPEC__ hy-workflow lint --json
